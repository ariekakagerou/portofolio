<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1e38"/>
      <stop offset="100%" style="stop-color:#0d2744"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1769e0"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="480" height="270" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.5">
    <line x1="0" y1="30" x2="480" y2="30"/>
    <line x1="0" y1="60" x2="480" y2="60"/>
    <line x1="0" y1="90" x2="480" y2="90"/>
    <line x1="0" y1="120" x2="480" y2="120"/>
    <line x1="0" y1="150" x2="480" y2="150"/>
    <line x1="0" y1="180" x2="480" y2="180"/>
    <line x1="0" y1="210" x2="480" y2="210"/>
    <line x1="0" y1="240" x2="480" y2="240"/>
    <line x1="60" y1="0" x2="60" y2="270"/>
    <line x1="120" y1="0" x2="120" y2="270"/>
    <line x1="180" y1="0" x2="180" y2="270"/>
    <line x1="240" y1="0" x2="240" y2="270"/>
    <line x1="300" y1="0" x2="300" y2="270"/>
    <line x1="360" y1="0" x2="360" y2="270"/>
    <line x1="420" y1="0" x2="420" y2="270"/>
  </g>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="480" height="3" fill="url(#accentGrad)"/>
  
  <!-- Corner reticles -->
  <path d="M4,4 L4,18 M4,4 L18,4" stroke="#1769e0" stroke-width="2" fill="none"/>
  <path d="M476,4 L476,18 M476,4 L462,4" stroke="#1769e0" stroke-width="2" fill="none"/>
  <path d="M4,266 L4,252 M4,266 L18,266" stroke="#e53935" stroke-width="2" fill="none"/>
  <path d="M476,266 L476,252 M476,266 L462,266" stroke="#1769e0" stroke-width="2" fill="none"/>
  
  <!-- Main card: Commerce flow diagram -->
  <!-- Left: Frontend module -->
  <rect x="30" y="70" width="100" height="130" rx="4" fill="#112847" stroke="#234873" stroke-width="1"/>
  <rect x="30" y="70" width="100" height="4" rx="2" fill="#1769e0"/>
  <text x="80" y="95" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">PORTAL WEB</text>
  <!-- Icon: Browser window -->
  <rect x="50" y="104" width="60" height="40" rx="3" fill="#1769e0" opacity="0.2" stroke="#1769e0" stroke-width="0.8"/>
  <line x1="50" y1="112" x2="110" y2="112" stroke="#1769e0" stroke-width="0.8"/>
  <rect x="55" y="117" width="8" height="4" rx="1" fill="#38bdf8" opacity="0.7"/>
  <rect x="68" y="117" width="8" height="4" rx="1" fill="#38bdf8" opacity="0.7"/>
  <rect x="55" y="126" width="50" height="2" rx="1" fill="#475569" opacity="0.6"/>
  <rect x="55" y="131" width="36" height="2" rx="1" fill="#475569" opacity="0.4"/>
  <text x="80" y="160" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">React / HTML</text>
  
  <!-- Arrow 1 -->
  <path d="M130,135 L165,135" stroke="#1769e0" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
  <polygon points="165,131 172,135 165,139" fill="#1769e0"/>
  <text x="148" y="128" font-family="monospace" font-size="7" fill="#38bdf8" text-anchor="middle">HTTP</text>
  
  <!-- Middle: API Gateway -->
  <rect x="172" y="60" width="136" height="150" rx="4" fill="#0b2a4e" stroke="#1769e0" stroke-width="1.5"/>
  <rect x="172" y="60" width="136" height="4" rx="2" fill="url(#accentGrad)"/>
  <text x="240" y="82" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">EXPRESS REST API</text>
  <text x="240" y="94" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">NODE.JS ENGINE</text>
  
  <!-- API endpoints list -->
  <rect x="184" y="102" width="112" height="15" rx="2" fill="#10b981" opacity="0.12" stroke="#10b981" stroke-width="0.5"/>
  <text x="188" y="113" font-family="monospace" font-size="7.5" fill="#10b981">GET  /products</text>
  
  <rect x="184" y="120" width="112" height="15" rx="2" fill="#f59e0b" opacity="0.12" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="188" y="131" font-family="monospace" font-size="7.5" fill="#f59e0b">POST /transactions</text>
  
  <rect x="184" y="138" width="112" height="15" rx="2" fill="#10b981" opacity="0.12" stroke="#10b981" stroke-width="0.5"/>
  <text x="188" y="149" font-family="monospace" font-size="7.5" fill="#10b981">GET  /reports</text>
  
  <rect x="184" y="156" width="112" height="15" rx="2" fill="#f59e0b" opacity="0.12" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="188" y="167" font-family="monospace" font-size="7.5" fill="#f59e0b">PUT  /inventory</text>
  
  <text x="240" y="196" font-family="monospace" font-size="7.5" fill="#475569" text-anchor="middle">42 ENDPOINTS TOTAL</text>
  
  <!-- Arrow 2 -->
  <path d="M308,135 L345,135" stroke="#1769e0" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
  <polygon points="345,131 352,135 345,139" fill="#1769e0"/>
  <text x="326" y="128" font-family="monospace" font-size="7" fill="#38bdf8" text-anchor="middle">SQL</text>
  
  <!-- Right: Database -->
  <rect x="352" y="70" width="100" height="130" rx="4" fill="#112847" stroke="#234873" stroke-width="1"/>
  <rect x="352" y="70" width="100" height="4" rx="2" fill="#e53935"/>
  <text x="402" y="95" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">DATABASE</text>
  <!-- DB cylinder icon -->
  <ellipse cx="402" cy="116" rx="28" ry="8" fill="none" stroke="#1769e0" stroke-width="1"/>
  <rect x="374" y="116" width="56" height="28" fill="none" stroke="#1769e0" stroke-width="1"/>
  <ellipse cx="402" cy="144" rx="28" ry="8" fill="#1769e0" opacity="0.15" stroke="#1769e0" stroke-width="1"/>
  <ellipse cx="402" cy="128" rx="28" ry="8" fill="#1769e0" opacity="0.1" stroke="#1769e0" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="402" y="160" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">MySQL</text>
  
  <!-- Bottom stats bar -->
  <rect x="30" y="218" width="420" height="30" rx="4" fill="#091a32" stroke="#162c4a" stroke-width="1"/>
  <text x="50" y="237" font-family="monospace" font-size="8" fill="#10b981">● ACID: 100%</text>
  <text x="175" y="237" font-family="monospace" font-size="8" fill="#38bdf8">QUERY: &lt;35ms</text>
  <text x="290" y="237" font-family="monospace" font-size="8" fill="#f59e0b">TX: ROLLBACK</text>
  <text x="390" y="237" font-family="monospace" font-size="8" fill="#e53935">BUMDesa v2.0</text>
  
  <!-- Red corner accent -->
  <rect x="0" y="250" width="50" height="10" fill="#e53935" opacity="0.5"/>
  <rect x="0" y="260" width="20" height="10" fill="#e53935" opacity="0.3"/>
</svg>
