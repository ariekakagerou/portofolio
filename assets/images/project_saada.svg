    <text x="16" y="90" font-family="monospace" font-size="5.5" fill="#94a3b8">Binarized / Skew Fix</text>

    <rect x="10" y="98" width="104" height="20" rx="2" fill="#0b1829" stroke="#1e3a8a" stroke-width="0.8"/>
