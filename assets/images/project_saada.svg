    <rect x="0" y="0" width="180" height="235" rx="5" fill="#0f223d" stroke="#1e4976" stroke-width="1.5"/>
    <rect x="6" y="6" width="168" height="223" rx="3" fill="#132b4a" stroke="#234e7d" stroke-width="1"/>
    
