  <path d="M588,12 L588,28 M588,12 L572,12" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M12,328 L12,312 M12,328 L28,328" stroke="#e53935" stroke-width="2" fill="none"/>
  <path d="M588,328 L588,312 M588,328 L572,328" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- Header Header Info -->
  <g font-family="'JetBrains Mono', monospace">
    <text x="36" y="32" font-size="10" fill="#38bdf8" font-weight="700" letter-spacing="1">SAADA // UNIT-05</text>
    <text x="160" y="32" font-size="9" fill="#64748b">[ AI ARCHIVE OCR PIPELINE ]</text>
    <text x="564" y="32" font-size="9" fill="#10b981" font-weight="700" text-anchor="end">STATUS: ACTIVE</text>
