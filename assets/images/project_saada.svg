    <rect x="16" y="94" width="148" height="28" rx="2" fill="#0284c7" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="22" y="106" font-family="monospace" font-size="7" fill="#00f0ff" font-weight="700">NAME: MOHAMMAD RIFAI</text>
    <text x="22" y="116" font-family="monospace" font-size="6.5" fill="#94a3b8">NISN: 0048192841 // THN: 2023</text>
    
