<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c18"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#cyberBg)"/>
  
  <!-- Server Rack Grid & Digital Nodes -->
  <g stroke="#1e3a8a" stroke-width="0.75" opacity="0.4">
    <path d="M 0 40 L 600 40 M 0 90 L 600 90 M 0 140 L 600 140 M 0 190 L 600 190 M 0 240 L 600 240 M 0 290 L 600 290"/>
    <path d="M 60 0 L 60 340 M 120 0 L 120 340 M 180 0 L 180 340 M 240 0 L 240 340 M 300 0 L 300 340 M 360 0 L 360 340 M 420 0 L 420 340 M 480 0 L 480 340 M 540 0 L 540 340"/>
  </g>

  <!-- Real-time Circuit Streams -->
  <g stroke="#0284c7" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M 40 120 L 140 120 L 180 160 L 220 160"/>
    <circle cx="40" cy="120" r="3" fill="#38bdf8"/>
    <circle cx="220" cy="160" r="3" fill="#38bdf8"/>

    <path d="M 560 220 L 460 220 L 420 180 L 380 180"/>
    <circle cx="560" cy="220" r="3" fill="#38bdf8"/>
    <circle cx="380" cy="180" r="3" fill="#38bdf8"/>
  </g>

  <!-- Center Hexagon & Youth Trigger Emblem -->
  <g transform="translate(300, 160)">
    <!-- Outer rotating HUD circle -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="70" fill="#091a32" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlow)"/>
    
    <!-- Stylized 'Y' / 'YT' Logo -->
    <path d="M -30 -35 L 0 5 L 30 -35 M 0 5 L 0 42" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polygon points="-30,-35 -15,-35 0,-12 -15,-12" fill="#0284c7"/>
    <polygon points="30,-35 15,-35 0,-12 15,-12" fill="#0284c7"/>
    <rect x="-4" y="5" width="8" height="35" rx="3" fill="#38bdf8"/>
  </g>

  <!-- Typography -->
  <text x="300" y="270" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="2">YOUTH TRIGGER</text>
  <text x="300" y="290" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle" letter-spacing="1">REALTIME WEBSOCKET // REDIS PUB-SUB</text>

  <!-- Corner Tech Indicators -->
  <text x="30" y="40" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">PORT: 8080</text>
  <text x="30" y="56" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">LATENCY: 14ms</text>
  <text x="500" y="40" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">SOCKETS: 1,420</text>
  <text x="500" y="56" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">REDIS: OK</text>
</svg>
